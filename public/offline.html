<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#174b3f" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | Aerolínea</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: #f1f3ed;
        color: #19332d;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Arial, sans-serif;
      }

      .card {
        width: 100%;
        max-width: 440px;
        border: 1px solid #dce2da;
        border-radius: 12px;
        background: #ffffff;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 50px -35px rgba(16, 46, 39, 0.5);
      }

      .logo {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 16px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #64766f;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 26px;
        line-height: 1.2;
      }

      p {
        max-width: 34ch;
        margin: 0 auto;
        color: #64766f;
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 6px;
        background: #c04e32;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #a94129;
      }

      button:focus-visible {
        outline: 2px solid #c04e32;
        outline-offset: 2px;
      }

      .hint {
        margin-top: 16px;
        font-size: 12px;
        line-height: 1.5;
      }

      .status {
        min-height: 1.5em;
        margin-top: 14px;
        color: #27715e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="/icons/icon-192.png"
        width="72"
        height="72"
        alt=""
      />
      <p class="eyebrow">AEROLÍNEA</p>
      <h1>Sin conexión</h1>
      <p>
        No pudimos cargar esta página porque no hay conexión a internet. Revisá
        tu red e intentá de nuevo.
      </p>
      <button id="retry" type="button">Reintentar</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="hint">
        Si estabas comprando un pasaje, esperá a recuperar la conexión antes de
        reintentar el pago.
      </p>
    </main>

    <script>
      const retryButton = document.getElementById("retry");
      const status = document.getElementById("status");

      retryButton.addEventListener("click", function () {
        if (navigator.onLine) {
          window.location.reload();
          return;
        }

        status.textContent =
          "Seguís sin conexión. Probá de nuevo en unos segundos.";
      });

      window.addEventListener("online", function () {
        status.textContent = "Conexión restablecida. Recargando…";
        window.location.reload();
      });
    </script>
  </body>
</html>
